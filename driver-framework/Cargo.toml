[package]
name = "driver-framework"
edition.workspace = true
version.workspace = true
description = "Domain-agnostic flow runtime: the Flow abstraction and the machine model."

[features]
default = []
# Persistence support: generic EventData with JSON storage
persist = ["dep:serde", "dep:serde_json"]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
