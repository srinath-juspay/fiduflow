[package]
name = "psp-store-framework"
edition.workspace = true
version.workspace = true
description = "Domain-agnostic storage: the Backend trait, the user-facing Persist trait, and a SQLite backend."

[features]
default = ["sqlite"]
sqlite = ["dep:rusqlite"]

[dependencies]
psp-machine-framework = { path = "../psp-machine-framework" }
rusqlite = { workspace = true, optional = true }
