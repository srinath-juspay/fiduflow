[package]
name = "psp_flow"
edition.workspace = true
version.workspace = true
description = "UPI PSP pay flow as a first-order state machine: entity, events, step. Pure, no deps, Aeneas-translatable."

[features]
default = []
# Debug/PartialEq derives are only needed by the runtime and tests; kept off for Charon.
runtime = []
# Persistence support: typed EventRequest/EventResponse with serde serialization
persist = ["runtime", "dep:serde", "dep:serde_json", "driver-framework/persist"]

[dependencies]
driver-framework = { path = "../driver-framework" }
serde = { version = "1.0", default-features = false, features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

[package.metadata.charon]
# `charon cargo` reads these; keeps the translated surface small.
